# LHWM configuration — ~/.config/lhwm/lhwm.conf
# Edit this file, then press Mod4+r. No recompilation or WM restart needed.

# Geometry
layout = master-stack
gap = 8
border_width = 2
master_ratio = 60           # percentage of the usable width for the master

# Borders: X color names or hexadecimal colors are accepted.
border_focus = #89b4fa
border_normal = #45475a

# Minimal top bar. The clock is implemented natively in HolyC using localtime/strftime.
# The format follows the usual strftime directives; the local system timezone is used.
bar_enabled = true
clock_enabled = true
clock_format = %a %d %b  %H:%M
clock_update_interval = 1  # seconds, similar to Qtile Clock.update_interval
bar_height = 28
bar_border_width = 1
# Outer topbar frame color; workspace square borders are configured below.
bar_border_color = #45475a
bar_bg = #1e1e2e
bar_fg = #cdd6f4
bar_accent = #d8ad4a
bar_icon_fg = #ffffff
bar_icon_shadow = #a85d26
bar_icon_enabled = true
bar_icon_mark = C+
bar_icon = HolyC

# Nine workspaces. Click their squares, or use Super+1..9.
# Super+Shift+1..9 moves the focused window to that workspace.
workspace_border_color = #45475a
workspace_active_border = #d8ad4a
workspace_active_bg = #3b3528
workspace_fg = #a6adc8
workspace_active_fg = #ffffff

# The tiny topbar uses an X11 core font. "fixed" is the standard alias.
# LHWM tries 6x13 as a fallback if the configured font is unavailable.
bar_font = fixed

# Keybindings: bind = MODIFIERS+KEY ACTION [COMMAND]
# Mod4 is Super/Windows. Mod4+Shift+q exits the window manager.
bind = Mod4+Return spawn alacritty
bind = Mod4+q kill
bind = Mod4+d spawn dmenu_run
bind = Mod4+Shift+q quit
bind = Mod4+r reload
bind = Mod4+m mode
bind = Mod4+j focus_next
bind = Mod4+k focus_prev
bind = Mod4+Tab layout_next
bind = Mod4+1 workspace 1
bind = Mod4+2 workspace 2
bind = Mod4+3 workspace 3
bind = Mod4+4 workspace 4
bind = Mod4+5 workspace 5
bind = Mod4+6 workspace 6
bind = Mod4+7 workspace 7
bind = Mod4+8 workspace 8
bind = Mod4+9 workspace 9
bind = Mod4+Shift+1 move_workspace 1
bind = Mod4+Shift+2 move_workspace 2
bind = Mod4+Shift+3 move_workspace 3
bind = Mod4+Shift+4 move_workspace 4
bind = Mod4+Shift+5 move_workspace 5
bind = Mod4+Shift+6 move_workspace 6
bind = Mod4+Shift+7 move_workspace 7
bind = Mod4+Shift+8 move_workspace 8
bind = Mod4+Shift+9 move_workspace 9

# Change the Mod4+d command to "rofi -show drun" to use Rofi instead.
# Other available actions:
#   spawn COMMAND  - launch a shell command
#   kill           - close the focused client (WM_DELETE_WINDOW, if supported)
#   quit           - exit LHWM
#   reload         - reload this file
#   mode           - switch tiling/floating
#   focus_next     - focus the next window
#   focus_prev     - focus the previous window
#   layout_next    - cycle master-stack, columns, monocle (tiling mode)
#   workspace N    - switch to workspace 1..9
#   move_workspace N - move focused window to workspace 1..9
